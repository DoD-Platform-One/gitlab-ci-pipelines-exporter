---
apiVersion: v2
name: gitlab-ci-pipelines-exporter
version: 0.3.6-bb.23
appVersion: v0.6.0
description: Prometheus / OpenMetrics exporter for GitLab CI pipelines insights
home: https://github.com/mvisonneau/gitlab-ci-pipelines-exporter
sources:
  - https://github.com/mvisonneau/helm-charts/tree/main/charts/gitlab-ci-pipelines-exporter
maintainers:
  - name: mvisonneau
    email: maxime.visonneau@gmail.com
dependencies:
  - name: gitlab-ci-pipelines-exporter
    version: 0.3.5
    repository: https://charts.visonneau.fr
    alias: upstream
  - name: gluon
    version: 0.9.8
    repository: oci://registry1.dso.mil/bigbang
  - name: redis
    version: 24.1.2-bb.1
    repository: oci://registry1.dso.mil/bigbang/maintained
    condition: redis-bb.enabled
    alias: redis-bb
annotations:
  bigbang.dev/maintenanceTrack: bb_maintained
  bigbang.dev/applicationVersions: |
    - gitlab-ci-pipelines-exporter: v0.6.0
  bigbang.dev/upstreamReleaseNotesMarkdown: |
    The [upstream chart's release notes](https://github.com/mvisonneau/gitlab-ci-pipelines-exporter/blob/main/CHANGELOG.md) may help when reviewing this package.
  helm.sh/images: |
    - name: gitlab-ci-pipelines-exporter
      image: registry1.dso.mil/ironbank/opensource/gitlab-ci-pipelines-exporter:v0.6.0
    - name: redis
      image: registry1.dso.mil/ironbank/opensource/redis/redis8:8.6.1
      condition: redis-bb.enabled
    - name: redis-exporter
      image: registry1.dso.mil/ironbank/bitnami/analytics/redis-exporter:v1.82.0
      condition: redis-bb.enabled
    - name: kubectl
      condition: gcpeJob.enabled
      image: registry1.dso.mil/ironbank/gitlab/gitlab/kubectl:18.9.2